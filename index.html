<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Pacman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <h1>Neon Pacman</h1>
      <p>Collect all pellets, avoid ghosts, and chase them during power mode.</p>
    </header>

    <main class="game-layout">
      <section class="board-panel" aria-label="Game area">
        <canvas id="gameCanvas" width="560" height="620" role="img" aria-label="Pacman game board"></canvas>
      </section>

      <aside class="side-panel" aria-label="Game controls and status">
        <div class="stat-grid">
          <div class="stat-card">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Level</span>
            <span class="stat-value" id="level">1</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Lives</span>
            <span class="stat-value" id="lives">3</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="bestScore">0</span>
          </div>
        </div>

        <div class="controls-card">
          <h2>How to Play</h2>
          <ul>
            <li><kbd>←↑→↓</kbd> or <kbd>WASD</kbd> to move</li>
            <li><kbd>P</kbd> to pause</li>
            <li><kbd>R</kbd> to restart</li>
          </ul>
        </div>

        <div class="button-row">
          <button id="pauseBtn" type="button">Pause</button>
          <button id="restartBtn" type="button" class="secondary">Restart</button>
        </div>
      </aside>
    </main>
  </div>

  <div id="overlay" class="overlay hidden" aria-live="polite">
    <div class="overlay-card">
      <h2 id="overlayTitle">Ready?</h2>
      <p id="overlayMessage">Press any movement key to start.</p>
      <button id="overlayAction" type="button">Start Game</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
